# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploys ChronoTunes (Vite app + yt-dlp audio API) as a single Docker web service.
services:
  - type: web
    name: chronotunes
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Bypass the password gate (set to "false" and provide VITE_APP_PASSWORD
      # if you want the gate enabled).
      - key: VITE_DISABLE_AUTH
        value: "true"
      # Same-origin: the app and /api are served by this one service.
      - key: VITE_AUDIO_API_BASE
        value: ""
      # YouTube blocks datacenter IPs ("Sign in to confirm you're not a bot").
      # Add a Netscape cookies.txt as a Render "Secret File" and point yt-dlp at
      # it. Uncomment and set the path to the mounted secret file:
      # - key: YT_DLP_COOKIES
      #   value: /etc/secrets/cookies.txt
      # Firebase (multi-device mode) - set the values in the Render dashboard.
      - key: VITE_APP_PASSWORD
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_DATABASE_URL
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
